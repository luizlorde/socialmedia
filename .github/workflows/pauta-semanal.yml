name: Pauta Semanal

on:
  # PAUSADO até resolver o bug do OAuth no claude-code-action (#1316/#1281).
  # Retomar reativando o schedule quando aplicarmos o workaround avançado.
  # schedule:
  #   - cron: '0 11 * * 1'   # Toda segunda 08h (BRT = UTC-3, então 11h UTC)
  workflow_dispatch:        # botão pra rodar manualmente quando quiser

jobs:
  gerar-pauta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write       # necessário pra commitar a memória atualizada
      id-token: write        # necessário pro claude-code-action autenticar
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
      CLICKUP_LIST_ID: ${{ secrets.CLICKUP_LIST_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Leia system-prompt.md, contexto.md, memoria/aprendizados.md e memoria/metricas.md.
            Em seguida, execute a FUNÇÃO 1 (gerar pauta) e a FUNÇÃO 2 (registrar no ClickUp):
            - Gere a pauta da semana (3 a 4 peças) seguindo os pilares e priorizando o que já funcionou.
            - Crie cada peça como tarefa no ClickUp usando scripts/clickup.sh.
            - Envie um resumo da pauta no Telegram usando scripts/telegram.sh.
            - Se notar algum padrão novo, atualize memoria/aprendizados.md.
          claude_args: |
            --model opus
            --max-turns 30
            --allowedTools "Read,Write,Edit,Bash(bash:*)"

      - name: Salvar memória atualizada
        run: |
          git config user.name "agente-social"
          git config user.email "actions@users.noreplace.github.com"
          git add memoria/ contexto.md
          git commit -m "Atualiza memória [skip ci]" || echo "Sem mudanças na memória"
          git push
